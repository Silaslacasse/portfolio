name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Must be present at build time: @nuxtjs/i18n bakes its baseUrl into the bundle and
      # registers it with nuxt-site-config, so a missing value here produces localhost
      # canonical, hreflang and sitemap URLs. See DEPLOY.md.
      NUXT_PUBLIC_SITE_URL: https://example.com

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
