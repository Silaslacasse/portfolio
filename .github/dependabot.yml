version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Nuxt and its modules move together; separate PRs for each mostly create conflicts.
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "@nuxtjs/*"
      dev-tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
          - "typescript"
          - "vue-tsc"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
